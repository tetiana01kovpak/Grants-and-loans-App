name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter create --platforms=android --org com.example .
      - run: cp android-template/MainActivity.kt android/app/src/main/kotlin/com/example/grant_compass/MainActivity.kt
      - name: Enable calendar permissions
        run: |
          sed -i '/<application/i\    <uses-permission android:name="android.permission.READ_CALENDAR" />\n    <uses-permission android:name="android.permission.WRITE_CALENDAR" />' android/app/src/main/AndroidManifest.xml
      - run: flutter pub get
      - run: rm -f analysis_options.yaml
      - run: flutter analyze lib --no-fatal-infos
      - run: flutter build apk --debug
      - uses: actions/upload-artifact@v4
        with:
          name: grant-compass-android-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
